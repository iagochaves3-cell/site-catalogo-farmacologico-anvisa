<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo Farmacológico Pediátrico — ANVISA</title>
<style>
  :root{
    --azul:#1f4e79; --azul2:#2e75b6; --azul3:#e8f0f8;
    --txt:#1a1a1a; --txt2:#5a6b7a; --borda:#d5dfe8;
    --verde:#1e7a45; --verde-bg:#e6f5ec;
    --verm:#b3261e; --verm-bg:#fdecea;
    --ama:#8a6100; --ama-bg:#fff6e0;
    --bg:#f6f8fa; --branco:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--txt); font-size:15px; line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  a{color:var(--azul2)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}

  /* ---------- cabeçalho ---------- */
  header{background:var(--azul);color:#fff;padding:20px 0 0}
  header h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.2px}
  header .sub{font-size:13px;opacity:.85;margin-top:4px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 16px;font-size:12.5px}
  .stats span{opacity:.92}
  .stats b{font-size:15px;font-weight:650}

  /* ---------- barra fixa de controles ---------- */
  .barra{
    position:sticky;top:0;z-index:40;background:#fff;
    border-bottom:1px solid var(--borda);box-shadow:0 1px 6px rgba(0,0,0,.05);
  }
  .barra-in{display:flex;gap:10px;align-items:center;padding:11px 16px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
  .campo{display:flex;align-items:center;gap:7px}
  .campo label{font-size:12px;font-weight:600;color:var(--txt2);white-space:nowrap}
  input[type=search],input[type=number]{
    font-family:inherit;font-size:14px;padding:8px 11px;border:1.5px solid var(--borda);
    border-radius:8px;background:#fff;color:var(--txt);outline:none;
  }
  input[type=search]{width:280px}
  input[type=number]{width:78px;text-align:center;font-weight:650;color:var(--verm);font-size:15px}
  input:focus{border-color:var(--azul2);box-shadow:0 0 0 3px rgba(46,117,182,.13)}
  .contador{margin-left:auto;font-size:12.5px;color:var(--txt2);white-space:nowrap}
  .contador b{color:var(--azul);font-size:14px}

  /* ---------- filtros ---------- */
  .filtros{padding:12px 16px 14px;max-width:1180px;margin:0 auto}
  .fx-tit{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
          color:var(--txt2);margin:0 0 7px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
  .chip{
    font-family:inherit;font-size:12.5px;padding:5px 11px;border-radius:20px;
    border:1.5px solid var(--borda);background:#fff;color:var(--txt2);
    cursor:pointer;transition:.13s;white-space:nowrap;
  }
  .chip:hover{border-color:var(--azul2);color:var(--azul2)}
  .chip[aria-pressed=true]{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
  .chip .n{opacity:.65;font-size:11px;margin-left:4px}

  /* ---------- lista ---------- */
  main{padding:18px 0 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px}
  .card{
    background:#fff;border:1px solid var(--borda);border-radius:10px;padding:13px 15px;
    cursor:pointer;transition:.14s;position:relative;
  }
  .card:hover{border-color:var(--azul2);box-shadow:0 3px 12px rgba(31,78,121,.1);transform:translateY(-1px)}
  .card:focus-visible{outline:2.5px solid var(--azul2);outline-offset:2px}
  .card h3{margin:0 0 3px;font-size:14.5px;font-weight:650;color:var(--azul);line-height:1.3}
  .card .cls{font-size:11.5px;color:var(--txt2);margin-bottom:7px;line-height:1.35}
  .card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:4px;font-weight:600;letter-spacing:.2px}
  .t-dos{background:var(--verde-bg);color:var(--verde)}
  .t-eme{background:var(--verm-bg);color:var(--verm)}
  .t-apr{background:var(--azul3);color:var(--azul2)}
  .t-ina{background:#f2f0fa;color:#5b48a8}
  .card .dose-ind{
    font-size:11px;color:var(--txt2);margin-top:8px;padding-top:7px;
    border-top:1px dashed var(--borda);line-height:1.35;font-weight:600;
  }
  .card .dose-ind .mais{
    background:var(--azul3);color:var(--azul2);border-radius:8px;
    padding:0 5px;font-size:10px;margin-left:3px;
  }
  .card .dose-linha{font-size:12.5px;color:var(--txt);margin-top:3px;
                    font-variant-numeric:tabular-nums}
  .card .dose-linha b{color:var(--verde);font-size:13.5px}

  /* ---------- detalhe ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(16,32,48,.55);z-index:100;
    display:none;padding:0;overflow-y:auto;
  }
  .overlay.on{display:block}
  .painel{
    background:#fff;max-width:900px;margin:0 auto;min-height:100%;
    padding:0 0 60px;position:relative;
  }
  @media(min-width:900px){
    .painel{margin:28px auto;border-radius:12px;min-height:0;box-shadow:0 14px 50px rgba(0,0,0,.28)}
  }
  .painel-top{
    position:sticky;top:0;background:var(--azul);color:#fff;padding:16px 20px;
    display:flex;align-items:flex-start;gap:12px;z-index:2;
  }
  @media(min-width:900px){.painel-top{border-radius:12px 12px 0 0}}
  .painel-top h2{margin:0;font-size:18px;font-weight:650;flex:1;line-height:1.3}
  .painel-top .sub2{font-size:12px;opacity:.85;margin-top:3px;font-weight:400}
  .fechar{
    background:rgba(255,255,255,.16);border:0;color:#fff;width:32px;height:32px;
    border-radius:8px;cursor:pointer;font-size:19px;line-height:1;flex-shrink:0;
  }
  .fechar:hover{background:rgba(255,255,255,.3)}
  .corpo{padding:20px}

  .bloco{margin-bottom:22px}
  .bloco h4{
    margin:0 0 9px;font-size:11.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.7px;color:var(--azul2);
    border-bottom:2px solid var(--azul3);padding-bottom:5px;
  }
  .apres-item{
    background:var(--azul3);border-left:3px solid var(--azul2);border-radius:0 6px 6px 0;
    padding:9px 12px;margin-bottom:7px;font-size:13.5px;line-height:1.5;
  }
  .texto{font-size:13.5px;line-height:1.6;color:#2c3e50}
  .esquema{
    background:#fafbfc;border:1px solid var(--borda);border-radius:7px;
    padding:10px 13px;margin-bottom:7px;font-size:13px;line-height:1.6;white-space:pre-wrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .alerta{
    background:var(--verm-bg);border-left:3px solid var(--verm);border-radius:0 6px 6px 0;
    padding:10px 13px;font-size:13px;line-height:1.55;color:#6b1610;
  }
  .calc-box{
    background:linear-gradient(135deg,#f0f7f2,#e6f5ec);border:1.5px solid #b8ddc6;
    border-radius:9px;padding:14px 16px;
  }
  .calc-row{display:flex;justify-content:space-between;align-items:baseline;
            padding:6px 0;border-bottom:1px dashed rgba(30,122,69,.22);font-size:13.5px}
  .calc-row:last-child{border-bottom:0}
  .calc-row .rot{color:#3d6b4f;font-weight:500}
  .calc-row .val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--verde);font-size:15px}
  .calc-nota{font-size:11.5px;color:var(--txt2);margin-top:9px;line-height:1.45}
  .emer-item{
    border:1px solid var(--borda);border-radius:7px;padding:11px 13px;margin-bottom:8px;
    background:#fff;
  }
  .emer-item .ind{font-weight:650;font-size:13.5px;color:var(--verm);margin-bottom:5px}
  .emer-item dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
  .emer-item dt{font-weight:600;color:var(--txt2);white-space:nowrap}
  .emer-item dd{margin:0;color:var(--txt)}

  /* ---------- posologia (detalhe) ---------- */
  .poso{
    border:1px solid var(--borda);border-radius:9px;margin-bottom:11px;
    overflow:hidden;background:#fff;
  }
  .poso-ind{
    background:var(--azul3);color:var(--azul);font-weight:650;font-size:13px;
    padding:9px 13px;line-height:1.35;border-bottom:1px solid var(--borda);
  }
  .poso-dados{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
    gap:1px;background:var(--borda);
  }
  .pd{background:#fbfcfd;padding:9px 12px;display:flex;flex-direction:column;gap:2px}
  .pd .rot{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt2);font-weight:600}
  .pd b{font-size:14px;font-variant-numeric:tabular-nums;color:var(--txt);font-weight:650}
  .pd.destaque{background:var(--verde-bg)}
  .pd.destaque b{color:var(--verde);font-size:15.5px}
  .poso-txt{
    padding:9px 13px;font-size:12.5px;line-height:1.55;color:#3d4d5c;
    background:#fafbfc;border-top:1px solid var(--borda);
  }
  .vazio{text-align:center;padding:60px 20px;color:var(--txt2)}
  .vazio b{display:block;font-size:16px;color:var(--txt);margin-bottom:6px}

  .rodape{
    margin-top:26px;padding:15px 18px;background:var(--ama-bg);border:1px solid #f0dcae;
    border-radius:9px;font-size:12px;line-height:1.6;color:#6b5310;
  }
  .rodape b{color:#4a3908}

  /* ---------- autoteste ---------- */
  .teste{margin-top:16px;font-size:11.5px;color:var(--txt2)}
  .teste button{
    font-family:inherit;font-size:11.5px;padding:5px 12px;border-radius:6px;
    border:1px solid var(--borda);background:#fff;cursor:pointer;color:var(--txt2);
  }
  .teste button:hover{border-color:var(--azul2);color:var(--azul2)}
  .teste .res{margin-top:8px;font-family:ui-monospace,monospace;white-space:pre-wrap;display:none}
  .teste .res.on{display:block}

  @media print{
    .barra,.filtros,.fechar,.teste,header .stats{display:none}
    .overlay{position:static;background:none;display:block}
    .painel{box-shadow:none;margin:0;max-width:100%}
    .painel-top{background:#fff;color:#000;border-bottom:2px solid #000}
    .card{break-inside:avoid}
  }
  @media(max-width:640px){
    input[type=search]{width:100%}
    .campo{flex:1 1 100%}
    .barra-in{padding:9px 12px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Catálogo Farmacológico Pediátrico</h1>
    <div class="sub">Apresentações, indicações, esquemas posológicos e emergências</div>
    <div class="stats">
      <span><b>651</b> fármacos</span>
      <span><b>657</b> blocos de apresentação</span>
      <span><b>1027</b> posologias</span>
      <span><b>437</b> fármacos com dose/kg</span>
      <span><b>57</b> com protocolo de emergência</span>
    </div>
  </div>
</header>

<div class="barra">
  <div class="barra-in">
    <div class="campo">
      <label for="busca">Buscar</label>

    </div>
    <div class="campo">
      <label for="peso">Peso (kg)</label>
      <input type="number" id="peso" value="12" min="0.3" max="120" step="0.1" inputmode="decimal">
    </div>
    <div class="contador"><b id="n-res">0</b> de 651</div>
  </div>
</div>

<div class="filtros">
  <p class="fx-tit">Categoria</p>
  <div class="chips" id="chips-cat"></div>
  <p class="fx-tit">Forma farmacêutica</p>
  <div class="chips" id="chips-forma"></div>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="titulo-painel">
  <div class="painel">
    <div class="painel-top">
      <div style="flex:1">
        <h2 id="titulo-painel"></h2>
        <div class="sub2" id="sub-painel"></div>
      </div>
      <button class="fechar" id="fechar" aria-label="Fechar">×</button>
    </div>
    <div class="corpo" id="corpo"></div>
  </div>
</div>

<div class="wrap"><div class="rodape" id="rodape"></div></div>

<script>
(function(){
  'use strict';

  var DADOS = JSON.parse(document.getElementById('dados').textContent);

  // ─────────────── normalização (busca sem acento)
  function norm(s){
    return String(s || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  // pré-computa o texto de busca de cada registro
  var INDEX = DADOS.map(function(r){
    var partes = [r.n, r.k];
    if (r.cl) partes.push(r.cl);
    if (r.i) partes.push(r.i);
    if (r.al) partes = partes.concat(r.al);
    if (r.a) partes = partes.concat(r.a);
    return norm(partes.join(' '));
  });

  // ─────────────── arredondamento seguro
  function arred(v, casas){
    if (!isFinite(v)) return '—';
    var f = Math.pow(10, casas);
    // epsilon corrige erro binário (1.005 -> 1.01)
    return (Math.round((v + Number.EPSILON * Math.abs(v)) * f) / f);
  }

  function fmtNum(v, casas){
    var n = arred(v, casas);
    if (n === '—') return '—';
    return String(n).replace('.', ',');
  }

  // ─────────────── cálculo por peso
  // d: {mn,mx,u,p}  co: {v,t}  it: '8h'
  function calcular(d, co, it, peso){
    if (!d || !(peso > 0)) return null;

    var p = d.p || 'dose';
    var tomadas = 1;
    if (p === 'dia') {
      if (it) {
        var h = parseInt(it, 10);
        if (h > 0 && h < 24) tomadas = Math.round(24 / h) || 1;
        else if (h >= 24) tomadas = 1;
      }
      // sem intervalo declarado: não divide (evita inventar esquema)
      if (!it) tomadas = 1;
    }

    var fator = (p === 'dia') ? (1 / tomadas) : 1;

    var toMg = { 'mg': 1, 'mcg': 0.001, 'g': 1000, 'ui': null, 'u': null, 'meq': null };
    var fM = toMg[String(d.u).toLowerCase()];
    if (fM === undefined) fM = null;

    var mn = d.mn * peso * fator;
    var mx = d.mx * peso * fator;

    var out = {
      un: d.u, per: p, tomadas: tomadas,
      mn: mn, mx: mx, faixa: mx > mn - 1e-9,
      volMn: null, volMx: null, volTipo: null
    };

    if (co && co.v > 0 && fM) {
      out.volMn = (mn * fM) / co.v;
      out.volMx = (mx * fM) / co.v;
      out.volTipo = co.t;
    }
    return out;
  }

  // dose "de destaque" do card: a primeira posologia calculável
  function doseDestaque(r, peso){
    var es = r.es || [];
    for (var i = 0; i < es.length; i++) {
      if (es[i].d) {
        var c = calcular(es[i].d, r.co, es[i].it, peso);
        if (c) return { c: c, e: es[i] };
      }
    }
    return null;
  }

  // ─────────────── estado
  var estado = { q: '', cat: '', forma: '', peso: 12 };

  // ─────────────── elementos
  var elBusca   = document.getElementById('busca');
  var elPeso    = document.getElementById('peso');
  var elGrid    = document.getElementById('grid');
  var elNres    = document.getElementById('n-res');
  var elChipsC  = document.getElementById('chips-cat');
  var elChipsF  = document.getElementById('chips-forma');
  var elOverlay = document.getElementById('overlay');
  var elTitulo  = document.getElementById('titulo-painel');
  var elSub     = document.getElementById('sub-painel');
  var elCorpo   = document.getElementById('corpo');
  var elFechar  = document.getElementById('fechar');

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─────────────── chips
  function montarChips(){
    var cats = {};
    DADOS.forEach(function(r){ cats[r.k] = (cats[r.k] || 0) + 1; });
    var listaCat = Object.keys(cats).sort(function(a,b){ return cats[b] - cats[a]; });

    var h = '<button class="chip" data-cat="" aria-pressed="true">Todas <span class="n">' + DADOS.length + '</span></button>';
    listaCat.forEach(function(c){
      h += '<button class="chip" data-cat="' + esc(c) + '" aria-pressed="false">'
         + esc(c) + ' <span class="n">' + cats[c] + '</span></button>';
    });
    elChipsC.innerHTML = h;

    var formas = {};
    DADOS.forEach(function(r){ if (r.fo) formas[r.fo] = (formas[r.fo] || 0) + 1; });
    var listaF = Object.keys(formas).sort(function(a,b){ return formas[b] - formas[a]; }).slice(0, 8);

    // abrevia cada combinação de forma para um rótulo curto e ÚNICO
    var ABREV = [
      ['Injetável / Parenteral', 'Injetável'],
      ['Líquida Oral / Gotas', 'Líquida'],
      ['Sólida Oral', 'Sólida'],
      ['Tópica / Local', 'Tópica'],
      ['Inalatória / Nasal', 'Inalatória'],
      ['Uso Hospitalar / Especial', 'Hospitalar']
    ];
    function abreviar(f){
      var partes = f.split(' + ');
      if (partes.length === 1) {
        for (var i = 0; i < ABREV.length; i++)
          if (partes[0].indexOf(ABREV[i][0]) === 0 || partes[0] === ABREV[i][0]) return ABREV[i][1];
        return partes[0].slice(0, 14);
      }
      var out = [];
      for (var j = 0; j < partes.length; j++) {
        var achou = null;
        for (var k = 0; k < ABREV.length; k++)
          if (partes[j].indexOf(ABREV[k][0]) === 0 || partes[j] === ABREV[k][0]) { achou = ABREV[k][1]; break; }
        if (achou && out.indexOf(achou) === -1) out.push(achou);
      }
      return out.join(' + ') || f.slice(0, 14);
    }

    var hf = '<button class="chip" data-forma="" aria-pressed="true">Todas</button>';
    listaF.forEach(function(f){
      hf += '<button class="chip" data-forma="' + esc(f) + '" aria-pressed="false" title="' + esc(f) + '">'
          + esc(abreviar(f)) + ' <span class="n">' + formas[f] + '</span></button>';
    });
    elChipsF.innerHTML = hf;
  }

  // ─────────────── filtro
  function filtrar(){
    var q = norm(estado.q);
    var termos = q ? q.split(' ').filter(Boolean) : [];
    var res = [];
    for (var i = 0; i < DADOS.length; i++) {
      var r = DADOS[i];
      if (estado.cat && r.k !== estado.cat) continue;
      if (estado.forma && r.fo !== estado.forma) continue;
      if (termos.length) {
        var tx = INDEX[i];
        var bate = true;
        for (var t = 0; t < termos.length; t++) {
          if (tx.indexOf(termos[t]) === -1) { bate = false; break; }
        }
        if (!bate) continue;
      }
      res.push(r);
    }
    return res;
  }

  // ─────────────── render da lista
  function render(){
    var res = filtrar();
    elNres.textContent = res.length;

    if (!res.length) {
      elGrid.innerHTML = '<div class="vazio" style="grid-column:1/-1">'
        + '<b>Nenhum fármaco encontrado</b>'
        + 'Tente outro termo, ou remova os filtros de categoria e forma.</div>';
      return;
    }

    var h = '';
    for (var i = 0; i < res.length; i++) {
      var r = res[i];
      h += '<div class="card" role="button" tabindex="0" data-i="' + DADOS.indexOf(r) + '">';
      h += '<h3>' + esc(r.n) + '</h3>';
      if (r.cl) h += '<div class="cls">' + esc(r.cl) + '</div>';
      else if (r.k !== 'Outros') h += '<div class="cls">' + esc(r.k) + '</div>';

      var tags = '';
      var temDose = (r.es || []).some(function(e){ return !!e.d; });
      if (temDose) tags += '<span class="tag t-dos">dose</span>';
      if (r.em) tags += '<span class="tag t-eme">emergência</span>';
      if (r.a && r.a.length) tags += '<span class="tag t-apr">' + r.a.length + ' apresent.</span>';
      if (r.i) tags += '<span class="tag t-ina">indicação</span>';
      if (tags) h += '<div class="tags">' + tags + '</div>';

      // linha de dose já calculada (primeira posologia com dose)
      var dd = doseDestaque(r, estado.peso);
      var c = dd ? dd.c : null;
      var nPoso = (r.es || []).filter(function(e){ return !!e.d; }).length;
      if (c) {
        // rótulo da indicação — essencial: a dose só faz sentido com o contexto
        var rot = dd.e.i || '';
        rot = rot.replace(/\s*\([^)]*\)\s*$/, '').trim();
        if (rot.length > 46) rot = rot.slice(0, 44) + '…';
        h += '<div class="dose-ind">' + esc(rot)
           + (nPoso > 1 ? ' <span class="mais">+' + (nPoso - 1) + '</span>' : '')
           + '</div>';
        var txt = fmtNum(c.mn, 2) + (c.faixa ? ' – ' + fmtNum(c.mx, 2) : '') + ' ' + c.un;
        if (c.per === 'dia') txt += '/dose';
        h += '<div class="dose-linha">' + fmtNum(estado.peso, 1) + ' kg → <b>' + txt + '</b>';
        if (c.volMn != null) {
          var vv = fmtNum(c.volMn, 2) + (c.volMx > c.volMn ? '–' + fmtNum(c.volMx, 2) : '');
          txt = vv + ' ' + (c.volTipo === 'mL' ? 'mL' : 'unid');
          h += ' · ' + txt;
        }
        h += '</div>';
      }
      h += '</div>';
    }
    elGrid.innerHTML = h;
  }

  // ─────────────── detalhe
  function abrir(i){
    var r = DADOS[i];
    if (!r) return;

    elTitulo.textContent = r.n;
    var sub = [];
    if (r.cl) sub.push(r.cl);
    else if (r.k !== 'Outros') sub.push(r.k);
    if (r.fo) sub.push(r.fo);
    elSub.textContent = sub.join(' · ');

    var h = '';

    // nome comercial / aliases
    if (r.al && r.al.length) {
      h += '<div class="bloco"><h4>Nomes comerciais / formas</h4><div class="texto">'
         + r.al.map(function(x){ return esc(x); }).join(' · ') + '</div></div>';
    }

    // ── posologias, cada uma com seu próprio cálculo
    var es = r.es || [];
    if (es.length) {
      h += '<div class="bloco"><h4>Posologias e dose para ' + fmtNum(estado.peso,1) + ' kg</h4>';

      for (var ei = 0; ei < es.length; ei++) {
        var e = es[ei];
        var c = calcular(e.d, r.co, e.it, estado.peso);

        h += '<div class="poso">';
        h += '<div class="poso-ind">' + esc(e.i) + '</div>';

        if (c) {
          h += '<div class="poso-dados">';
          h += '<div class="pd"><span class="rot">Por kg</span><b>'
             + fmtNum(e.d.mn, 3) + (e.d.mx > e.d.mn ? '–' + fmtNum(e.d.mx, 3) : '')
             + ' ' + esc(e.d.u) + '/kg/' + esc(e.d.p) + '</b></div>';

          h += '<div class="pd destaque"><span class="rot">'
             + (c.per === 'dia' ? 'Por dose' : 'Dose') + '</span><b>'
             + fmtNum(c.mn, 2) + (c.faixa ? ' – ' + fmtNum(c.mx, 2) : '')
             + ' ' + esc(c.un) + '</b></div>';

          if (c.per === 'dia' && c.tomadas > 1) {
            h += '<div class="pd"><span class="rot">Total no dia</span><b>'
               + fmtNum(c.mn * c.tomadas, 1)
               + (c.faixa ? ' – ' + fmtNum(c.mx * c.tomadas, 1) : '')
               + ' ' + esc(c.un) + '</b></div>';
          }

          if (c.volMn != null) {
            h += '<div class="pd"><span class="rot">Volume'
               + (c.per === 'dia' ? '/dose' : '') + '</span><b>'
               + fmtNum(c.volMn, 2) + (c.volMx > c.volMn ? ' – ' + fmtNum(c.volMx, 2) : '')
               + ' ' + (c.volTipo === 'mL' ? 'mL' : 'unid') + '</b></div>';
          }

          if (c.per === 'dia' && c.tomadas > 1) {
            h += '<div class="pd"><span class="rot">Tomadas</span><b>'
               + c.tomadas + '×/dia (' + esc(e.it) + ')</b></div>';
          } else if (e.it) {
            h += '<div class="pd"><span class="rot">Intervalo</span><b>' + esc(e.it) + '</b></div>';
          }

          // checagem reversa do volume
          if (c.volMn != null && r.co) {
            var toMg = { 'mg':1, 'mcg':0.001, 'g':1000 };
            var fM = toMg[String(c.un).toLowerCase()];
            if (fM) {
              var volta = (c.volMn * r.co.v) / fM;
              var okv = Math.abs(volta - c.mn) < 0.02;
              h += '<div class="pd"><span class="rot">Reversa</span><b style="color:'
                 + (okv ? 'var(--verde)' : 'var(--verm)') + '">'
                 + (okv ? '✓' : '✗') + ' ' + fmtNum(volta, 2) + ' ' + esc(c.un) + '</b></div>';
            }
          }
          h += '</div>';
        }

        h += '<div class="poso-txt">' + esc(e.t) + '</div>';
        h += '</div>';
      }

      h += '<div class="calc-nota" style="margin-top:10px">Aritmética sobre a dose/kg documentada. '
         + 'Não valida indicação, faixa etária nem teto máximo — confira na fonte.</div>';
      h += '</div>';
    }

    // apresentações
    if (r.a && r.a.length) {
      h += '<div class="bloco"><h4>Apresentações</h4>';
      r.a.forEach(function(x){ h += '<div class="apres-item">' + esc(x) + '</div>'; });
      if (r.ap && r.a.indexOf(r.ap) === -1) {
        h += '<div class="apres-item"><b>Em uso:</b> ' + esc(r.ap) + '</div>';
      }
      h += '</div>';
    }

    // indicações
    if (r.i) {
      h += '<div class="bloco"><h4>Indicações</h4><div class="texto">' + esc(r.i) + '</div></div>';
    }

    // emergência
    if (r.em && r.em.length) {
      h += '<div class="bloco"><h4>Emergência e parada</h4>';
      r.em.forEach(function(e){
        h += '<div class="emer-item"><div class="ind">' + esc(e.i) + '</div><dl>';
        if (e.d)  h += '<dt>Dose</dt><dd>' + esc(e.d) + '</dd>';
        if (e.v)  h += '<dt>Via</dt><dd>' + esc(e.v) + '</dd>';
        if (e.mx) h += '<dt>Máximo</dt><dd>' + esc(e.mx) + '</dd>';
        if (e.p)  h += '<dt>Preparo</dt><dd>' + esc(e.p) + '</dd>';
        if (e.mo) h += '<dt>Monitor</dt><dd>' + esc(e.mo) + '</dd>';
        h += '</dl></div>';
      });
      h += '</div>';
    }

    // contraindicações
    if (r.c) {
      h += '<div class="bloco"><h4>Contraindicações e restrições</h4>'
         + '<div class="alerta">' + esc(r.c) + '</div></div>';
    }

    // rodapé de fonte
    h += '<div class="rodape"><b>Status da fonte:</b> NAO_VALIDADO_CLINICAMENTE. '
       + 'Conteúdo documental recuperado da PLANILHA_ANVISA_FINAL.xlsx. '
       + 'Não usar em atendimento sem conferência contra bula, protocolo institucional '
       + 'ou fonte primária.</div>';

    elCorpo.innerHTML = h;
    elOverlay.classList.add('on');
    document.body.style.overflow = 'hidden';
    elFechar.focus();
  }

  function fechar(){
    elOverlay.classList.remove('on');
    document.body.style.overflow = '';
  }

  // ─────────────── eventos (delegação, sem onclick inline)
  elBusca.addEventListener('input', function(e){
    estado.q = e.target.value;
    render();
  });

  elPeso.addEventListener('input', function(e){
    var v = parseFloat(String(e.target.value).replace(',', '.'));
    estado.peso = (isFinite(v) && v > 0) ? v : 0;
    render();
  });

  elChipsC.addEventListener('click', function(e){
    var b = e.target.closest('[data-cat]');
    if (!b) return;
    estado.cat = b.getAttribute('data-cat');
    Array.prototype.forEach.call(elChipsC.querySelectorAll('[data-cat]'), function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    render();
  });

  elChipsF.addEventListener('click', function(e){
    var b = e.target.closest('[data-forma]');
    if (!b) return;
    estado.forma = b.getAttribute('data-forma');
    Array.prototype.forEach.call(elChipsF.querySelectorAll('[data-forma]'), function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    render();
  });

  elGrid.addEventListener('click', function(e){
    var c = e.target.closest('[data-i]');
    if (c) abrir(parseInt(c.getAttribute('data-i'), 10));
  });

  elGrid.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var c = e.target.closest('[data-i]');
    if (c) { e.preventDefault(); abrir(parseInt(c.getAttribute('data-i'), 10)); }
  });

  elFechar.addEventListener('click', fechar);

  elOverlay.addEventListener('click', function(e){
    if (e.target === elOverlay) fechar();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && elOverlay.classList.contains('on')) fechar();
  });

  // ─────────────── autoteste
  function autoteste(){
    var log = [];
    var ok = 0, fail = 0;

    function chk(nome, cond, det){
      if (cond) { ok++; log.push('  OK   ' + nome); }
      else { fail++; log.push('  FALHA ' + nome + (det ? ' — ' + det : '')); }
    }

    // 1) arredondamento
    chk('arred(1.005, 2) = 1.01', arred(1.005, 2) === 1.01, String(arred(1.005, 2)));
    chk('arred(2.675, 2) = 2.68', arred(2.675, 2) === 2.68, String(arred(2.675, 2)));

    // 2) normalização
    chk('norm remove acento', norm('Ácido Acetilsalicílico') === 'acido acetilsalicilico');
    chk('norm remove pontuação', norm('Adrenalina (1:1000)') === 'adrenalina 1 1000');

    // 3) dose por peso — dose única
    var d1 = {mn:15, mx:15, u:'mg', p:'dose'};
    var c1 = calcular(d1, null, '', 12);
    chk('15 mg/kg × 12 kg = 180 mg', c1 && Math.abs(c1.mn - 180) < 0.001, c1 ? String(c1.mn) : 'null');

    // 4) dose por dia com 8/8h (3 tomadas)
    var d2 = {mn:50, mx:50, u:'mg', p:'dia'};
    var c2 = calcular(d2, null, '8h', 12);
    chk('50 mg/kg/dia ÷ 3 tomadas × 12 kg = 200/dose',
        c2 && Math.abs(c2.mn - 200) < 0.001, c2 ? String(c2.mn) : 'null');

    // 5) sem intervalo não divide (não inventa esquema)
    var c2b = calcular(d2, null, '', 12);
    chk('sem intervalo: 50 mg/kg/dia × 12 = 600 (não divide)',
        c2b && Math.abs(c2b.mn - 600) < 0.001, c2b ? String(c2b.mn) : 'null');

    // 6) volume por concentração
    var d3 = {mn:10, mx:10, u:'mg', p:'dose'};
    var c3 = calcular(d3, {v:50, t:'mL'}, '', 10);
    chk('10 mg/kg × 10 kg / 50 mg/mL = 2 mL',
        c3 && Math.abs(c3.volMn - 2) < 0.001, c3 ? String(c3.volMn) : 'null');

    // 7) checagem reversa
    var volta = c3.volMn * 50;
    chk('reversa: 2 mL × 50 mg/mL = 100 mg', Math.abs(volta - c3.mn) < 0.001, String(volta));

    // 8) conversão mcg -> mL
    var d4 = {mn:10, mx:10, u:'mcg', p:'dose'};
    var c4 = calcular(d4, {v:1, t:'mL'}, '', 10);
    chk('10 mcg/kg × 10 kg = 100 mcg = 0,1 mL de 1 mg/mL',
        c4 && Math.abs(c4.volMn - 0.1) < 0.0001, c4 ? String(c4.volMn) : 'null');

    // 9) peso zero não calcula
    chk('peso 0 não calcula', calcular(d1, null, '', 0) === null);

    // 10) faixa
    var d5 = {mn:10, mx:20, u:'mg', p:'dose'};
    var c5 = calcular(d5, null, '', 5);
    chk('faixa 10-20 mg/kg × 5 kg = 50-100', c5 && c5.mn === 50 && c5.mx === 100 && c5.faixa);

    // 11) AAS não confunde Kawasaki com antiagregante
    var aas = null;
    for (var ai = 0; ai < DADOS.length; ai++) {
      if (norm(DADOS[ai].n).indexOf('acetilsalic') !== -1) { aas = DADOS[ai]; break; }
    }
    if (aas && aas.es) {
      var temAntiag = aas.es.some(function(e){
        return e.d && e.d.mn === 3 && e.d.mx === 5;
      });
      var temKawasaki = aas.es.some(function(e){
        return e.d && e.d.mn === 80;
      });
      chk('AAS: antiagregante 3-5 e Kawasaki 80-100 coexistem como itens separados',
          temAntiag && temKawasaki);
      chk('AAS tem ' + aas.es.length + ' posologias distintas', aas.es.length >= 3, String(aas.es.length));
    } else {
      chk('AAS encontrado com posologias', false);
    }

    // 12) contagem de registros
    chk('base tem registros', DADOS.length > 600, String(DADOS.length));
    chk('índice de busca bate com a base', INDEX.length === DADOS.length);

    // 13) filtro de texto
    estado.q = 'adrenalina'; estado.cat = ''; estado.forma = '';
    var f = filtrar();
    chk('busca "adrenalina" acha algo', f.length > 0, String(f.length));
    estado.q = 'zzzznaoexiste'; 
    chk('busca impossível retorna 0', filtrar().length === 0);
    estado.q = '';

    return { ok: ok, fail: fail, log: log.join('\n') };
  }

  // ─────────────── rodapé + botão de teste
  document.getElementById('rodape').innerHTML =
    '<b>Fonte e limites.</b> ' + DADOS.length + ' fármacos, com apresentações, indicações, '
    + 'esquemas posológicos e protocolos de emergência recuperados da PLANILHA_ANVISA_FINAL.xlsx '
    + '(abas Apresentações ANVISA, Monografias Pediátricas, Emergência &amp; Parada e '
    + 'Calculadora &amp; Prescrição). Todo o acervo se declara <b>NAO_VALIDADO_CLINICAMENTE</b>. '
    + 'Os cálculos por peso são aritméticos e conferidos por checagem reversa, mas não substituem '
    + 'bula, protocolo institucional ou julgamento médico.'
    + '<div class="teste"><button id="btn-teste">Rodar autoteste</button>'
    + '<div class="res" id="res-teste"></div></div>';

  document.getElementById('btn-teste').addEventListener('click', function(){
    var r = autoteste();
    var el = document.getElementById('res-teste');
    el.textContent = r.log + '\n\n' + r.ok + ' passaram, ' + r.fail + ' falharam';
    el.classList.add('on');
  });

  // ─────────────── init
  montarChips();
  render();

  // expõe para inspeção no console
  window.__catalogo = { dados: DADOS, filtrar: filtrar, calcular: calcular, autoteste: autoteste };
})();
</script>
